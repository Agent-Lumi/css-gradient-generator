<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Gradient Generator</title>
    <link rel="manifest" href="manifest.json">
    <script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")</script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎨 CSS Gradient Generator</h1>
        <p class="subtitle">Create beautiful CSS gradients with live preview</p>
        
        <div class="gradient-preview" id="preview"></div>
        
        <div class="gradient-actions">
            <button id="randomGradient" class="btn btn-random" title="Random gradient (Ctrl+R)">🎲 Random</button>
            <button id="saveGradient" class="btn btn-save" title="Save to gallery (Ctrl+S)">💾 Save</button>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label>Gradient Type</label>
                <select id="gradientType">
                    <option value="linear">Linear</option>
                    <option value="radial">Radial</option>
                    <option value="conic">Conic</option>
                </select>
            </div>
            
            <div class="control-group" id="angleControl">
                <label>Angle: <span id="angleValue">90</span>°</label>
                <input type="range" id="angle" min="0" max="360" value="90">
            </div>
            
            <div class="colors-section">
                <h3>Colors</h3>
                <div class="color-stops" id="colorStops">
                    <div class="color-stop">
                        <input type="color" class="color-picker" value="#667eea">
                        <input type="number" class="position" value="0" min="0" max="100">%
                    </div>
                    <div class="color-stop">
                        <input type="color" class="color-picker" value="#764ba2">
                        <input type="number" class="position" value="100" min="0" max="100">%
                    </div>
                </div>
                <button id="addColor" class="btn btn-secondary">+ Add Color</button>
            </div>
        </div>
        
        <div class="output-section">
            <h3>CSS Code</h3>
            <div class="code-block">
                <code id="cssCode">background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);</code>
                <div class="code-actions">
                    <button id="copyBtn" class="btn btn-copy">Copy</button>
                    <button id="downloadBtn" class="btn btn-download" title="Download gradient as PNG">📥 PNG</button>
                </div>
            </div>
        </div>
        
        <div class="saved-gradients" id="savedGradients">
            <h3>Saved Gradients <span id="savedCount" class="count-badge">0</span></h3>
            <div class="saved-grid" id="savedGrid"></div>
        </div>
        
        <div class="presets">
            <h3>Presets</h3>
            <div class="preset-grid" id="presets"></div>
        </div>
        
        <div class="keyboard-hint">
            <p>💡 <strong>Keyboard shortcuts:</strong> Ctrl+R = Random | Ctrl+S = Save | Ctrl+C = Copy CSS</p>
        </div>
    </div>
    
    <canvas id="gradientCanvas" style="display: none;"></canvas>
    <script src="app.js"></script>
</body>
</html>
